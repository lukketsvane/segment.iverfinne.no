<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: black; }
      .fg { fill: white; stroke: white; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: white; }
      .fg { fill: black; stroke: black; }
    }
  </style>
  <defs>
    <pattern id="checker" width="23" height="23" patternUnits="userSpaceOnUse">
      <rect class="fg" width="11.5" height="11.5" />
      <rect class="fg" x="11.5" y="11.5" width="11.5" height="11.5" />
    </pattern>
    <clipPath id="disc">
      <circle cx="90" cy="90" r="44" />
    </clipPath>
  </defs>
  <rect class="bg" width="180" height="180" rx="37" />
  <g clip-path="url(#disc)">
    <rect x="46" y="46" width="88" height="88" fill="url(#checker)" />
  </g>
  <circle cx="90" cy="90" r="44" class="fg" fill="none" stroke-width="6" />
</svg>
