<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: black; }
      .fg { fill: white; stroke: white; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: white; }
      .fg { fill: black; stroke: black; }
    }
  </style>
  <defs>
    <pattern id="checker" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect class="fg" width="12.5" height="12.5" />
      <rect class="fg" x="12.5" y="12.5" width="12.5" height="12.5" />
    </pattern>
    <clipPath id="dome">
      <path d="M 40 115 A 50 50 0 0 1 140 115 Z" />
    </clipPath>
  </defs>
  <rect class="bg" width="180" height="180" rx="37" />
  <g clip-path="url(#dome)">
    <rect x="40" y="65" width="100" height="50" fill="url(#checker)" />
  </g>
  <path d="M 40 115 A 50 50 0 0 1 140 115" class="fg" fill="none" stroke-width="7" stroke-linecap="butt" />
</svg>
